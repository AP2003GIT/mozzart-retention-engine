spring:
  application:
    name: mozzart-retention-engine-backend

server:
  port: ${PORT:${RETENTION_API_PORT:8787}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

retention:
  persistence: ${RETENTION_PERSISTENCE:file}
  data-file: ${RETENTION_DATA_FILE:../.retention-spring-backend.json}
  stream-interval-ms: ${RETENTION_STREAM_MS:2200}
