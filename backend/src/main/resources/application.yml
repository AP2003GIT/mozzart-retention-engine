spring:
  application:
    name: mozzart-retention-engine-backend

server:
  port: ${PORT:${RETENTION_API_PORT:8787}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

retention:
  persistence: ${RETENTION_PERSISTENCE:file}
  data-file: ${RETENTION_DATA_FILE:../.retention-spring-backend.json}
  stream-interval-ms: ${RETENTION_STREAM_MS:2200}
  microservices:
    enabled: ${RETENTION_MICROSERVICES:false}
    risk-url: ${RETENTION_RISK_URL:http://127.0.0.1:8792}
    crm-url: ${RETENTION_CRM_URL:http://127.0.0.1:8793}
